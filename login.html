<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Nizam College</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --navy:      #1B2A4A;
      --gold:      #C9A84C;
      --dark-gold: #8B6914;
    }

    body {
      background: linear-gradient(135deg, #1B2A4A 0%, #243660 60%, #1a3a2a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }

    /* ── Login card ── */
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    .card-header-custom {
      background: var(--navy);
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 3px solid var(--gold);
    }
    .card-header-custom .logo-ring {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: rgba(201,168,76,.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      color: var(--gold);
      margin: 0 auto 14px;
    }
    .card-header-custom h4 {
      color: var(--gold);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      margin: 0 0 4px;
    }
    .card-header-custom p {
      color: #8fa3c0;
      font-size: .8rem;
      margin: 0;
    }

    .card-body-custom { padding: 32px; }

    .form-label {
      font-size: .82rem;
      font-weight: 700;
      color: #444;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .input-group-text {
      background: var(--navy);
      color: var(--gold);
      border: 1px solid #dee2e6;
      border-right: none;
    }
    .form-control {
      border-left: none;
      padding: 10px 14px;
    }
    .form-control:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 .2rem rgba(201,168,76,.2);
    }
    .form-control:focus + .input-group-text,
    .input-group:focus-within .input-group-text {
      border-color: var(--gold);
    }

    .btn-login {
      background: var(--navy);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .5px;
      transition: background .2s;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--dark-gold); color: #fff; }

    .error-box {
      background: #fff5f5;
      border: 1px solid #f5c6cb;
      border-radius: 10px;
      padding: 10px 14px;
      color: #721c24;
      font-size: .88rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #8fa3c0;
      font-size: .83rem;
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--gold); }

    /* Default credentials hint */
    .hint-box {
      background: #f8f9fa;
      border-radius: 10px;
      border: 1px dashed #ccc;
      padding: 10px 14px;
      font-size: .8rem;
      color: #666;
      margin-bottom: 20px;
    }
    .hint-box strong { color: var(--navy); }
  </style>
</head>
<body>

<div class="login-card">
  <!-- Header -->
  <div class="card-header-custom">
    <div class="logo-ring"><i class="fa-solid fa-graduation-cap"></i></div>
    <h4>NIZAM COLLEGE</h4>
    <p>Administrator Login &bull; Certificate System</p>
  </div>

  <!-- Form -->
  <div class="card-body-custom">

    {% if error %}
    <div class="error-box">
      <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Enter username" autocomplete="username" required />
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Enter password" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In to Admin Panel
      </button>
    </form>

    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-left me-1"></i>Back to Verification Portal
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
